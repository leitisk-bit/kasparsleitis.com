# /etc/nginx/sites-available/oreplay   (then: ln -s ../sites-available/oreplay /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx)
server {
    listen 80;
    server_name telpuo.kasparsleitis.com;     # then: sudo certbot --nginx -d telpuo.kasparsleitis.com
    client_max_body_size 60m;                 # map PDFs and FIT files
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
    }
}
# To serve it under a path instead (e.g. https://your.site/oreplay/), use:
#   location /oreplay/ { proxy_pass http://127.0.0.1:8090/; client_max_body_size 60m; proxy_read_timeout 600s; }
