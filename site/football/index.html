<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Football Stats</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#16201a;--muted:#6a756d;--accent:#1f7a4d;--accent-soft:#e3f1e9;--line:#e3e7e0;--good:#1f7a4d;--bad:#b3261e;--warn:#9a6700;--bar:#cfd8d1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#171e19;--ink:#e7ece8;--muted:#93a097;--accent:#3fbf7f;--accent-soft:#1c3226;--line:#26302a;--good:#3fbf7f;--bad:#ff8a80;--warn:#e3b341;--bar:#2e3a32}}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--ink);text-decoration:none} a:hover{color:var(--accent);text-decoration:underline}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto;white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.logout{border:1px solid var(--line);background:none;color:var(--muted);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
main{max-width:1150px;margin:0 auto;padding:18px 16px 60px}
.head h2{font-size:21px;margin:0 0 4px} .head p{margin:0 0 4px;color:var(--muted);font-size:14px;max-width:820px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:14px 0}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select,input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 11px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font:inherit}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:15px;margin:0 0 8px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.note b{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums} .tile .s{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.l,th.l{text-align:left} td.wrap{white-space:normal}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.won{color:var(--good);font-weight:650} .lost{color:var(--bad);font-weight:650} .void{color:var(--muted)}
.logo{width:18px;height:18px;vertical-align:-4px;margin-right:5px;object-fit:contain}
.probbar{display:flex;height:6px;border-radius:3px;overflow:hidden;width:120px;background:var(--bar)}
.probbar i{display:block;height:100%} .probbar i:nth-child(1){background:var(--accent)} .probbar i:nth-child(2){background:var(--bar)} .probbar i:nth-child(3){background:var(--warn)}
.chip{display:inline-block;background:var(--accent-soft);border-radius:999px;padding:2px 9px;font-size:12.5px;margin:2px 4px 2px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.dot{width:22px;height:22px;border-radius:5px;font-size:11px;display:grid;place-items:center;color:#fff}
.mgroup{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 12px}
#modal .card{max-width:900px;width:100%;position:relative}
#modal .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
@media (max-width:700px){header{padding:8px 12px} main{padding:14px 12px 50px} .cols2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>⚽ Football Stats</h1>
  <nav id="nav"></nav>
  <button class="logout" id="outBtn">Log out</button>
</header>
<form id="signin" class="card" hidden style="max-width:340px;margin:60px auto">
  <h3>Admin sign-in</h3>
  <p class="muted small" style="margin-top:0">Same admin password as the map library and Server Info.</p>
  <input id="keyIn" type="password" placeholder="Password" autocomplete="current-password" style="width:100%">
  <button class="btn" style="width:100%;margin-top:10px">Sign in</button>
  <p id="signErr" hidden class="lost small" style="margin:10px 0 0">Wrong password.</p>
</form>
<main id="app"></main>
<div id="modal" hidden><div class="card"><button class="x" id="mx">×</button><div id="mbody"></div></div></div>

<script>
// On kasparsleitis.com the data comes from the home server through the Cloudflare tunnel
// (the replay app at telpuo.kasparsleitis.com passes /football-api/ on to the football app).
// On the home network (server-ip:8095/football/) the app's own login is used.
const REMOTE = /(^|\.)kasparsleitis\.com$/.test(location.hostname);
const API = REMOTE ? 'https://telpuo.kasparsleitis.com/football-api' : '/football/api';
let KEY = ''; try { KEY = localStorage.getItem('ior:key') || ''; } catch(e){}
const $ = s => document.querySelector(s);
const app = $('#app');
const LABEL = {corners:'Corners', total_shots:'Shots', shots_on_goal:'Shots on target', offsides:'Offsides', subs:'Substitutions', goals:'Goals', fouls:'Fouls', yellow:'Yellow cards'};
const PSTATS = ['corners','total_shots','shots_on_goal','offsides','subs'];
const TABS = [['matches','Matches'],['teams','Teams'],['predictions','Predictions'],['confidence','Confidence'],['bet','Bet on'],['sure','Sure Bets'],['easy','Easy Wins'],['data','Data']];
let META = {competitions:[], seasons:[]};
const ST = {}; try { Object.assign(ST, JSON.parse(localStorage.getItem('fb:ui') || '{}')); } catch(e){}
const save = () => { try { localStorage.setItem('fb:ui', JSON.stringify(ST)); } catch(e){} };

async function api(path, opts = {}){
  const headers = {...(opts.headers || {})}; if (REMOTE) headers['X-Admin-Key'] = KEY;
  const r = await fetch(API + path, {...opts, headers, cache:'no-store', credentials: REMOTE ? 'omit' : 'same-origin'});
  if (r.status === 401 || r.status === 403){ if (REMOTE) showSignin(); else location.href = '/football/login'; throw new Error('login'); }
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = v => v == null ? '–' : (+v).toFixed(1);
const fmt = v => v == null ? '–' : (Math.round(v*100)/100).toString();
const pct = (p, d=0) => p == null ? '–' : (p*100).toFixed(d) + '%';
const fair = p => p > 0 ? (1/p).toFixed(2) : '–';
const dt = s => new Date(s).toLocaleString(undefined, {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const tm = s => new Date(s).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
const dd = s => new Date(s).toLocaleDateString(undefined, {weekday:'short', day:'2-digit', month:'short'});
const logo = u => u ? `<img class="logo" src="${esc(u)}" alt="" loading="lazy">` : '';
const opts = (list, val, blank) => (blank ? `<option value="">${blank}</option>` : '') + list.map(([v,t]) => `<option value="${v}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('');
const compSel = (v, blank='All competitions') => `<select class="comp">${opts(META.competitions.map(c => [c.id, c.name]), v, blank)}</select>`;
const FINISHED = ['FT','AET','PEN'];
const resCls = r => r === 'won' ? 'won' : r === 'lost' ? 'lost' : 'void';
const resTxt = r => r === 'won' ? '✓ won' : r === 'lost' ? '✗ lost' : r === 'void' ? 'void' : '';

function seg(name, value, options, onChange){
  const id = 'seg-' + name.replace(/[^a-z0-9]/gi, '');
  setTimeout(() => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b)); onChange(b.dataset.v); }));
  return `<label>${esc(name)}<span class="seg" id="${id}">${options.map(([v,t]) => `<button type="button" data-v="${v}" class="${String(v)===String(value)?'on':''}">${t}</button>`).join('')}</span></label>`;
}
const DAYS = [['week','Last 7 days'],['yesterday','Yesterday'],['today','Today'],['tomorrow','Tomorrow'],['next','Next 7 days']];
function dayRange(k){
  const d0 = new Date(); d0.setHours(0,0,0,0); const day = 864e5, now = Date.now();
  const r = {week:[now - 7*day, now], yesterday:[+d0 - day, +d0], today:[+d0, +d0 + day], tomorrow:[+d0 + day, +d0 + 2*day], next:[now, now + 7*day]}[k];
  return {frm: new Date(r[0]).toISOString(), to: new Date(r[1]).toISOString(), past: r[1] <= now + 36e5};
}
function sideName(m, side){ return side === 'home' ? m.home : side === 'away' ? m.away : side; }
function pickLabel(p, m){
  if (p.market === '1x2') return p.side === 'draw' ? 'Draw' : `${esc(sideName(m, p.side))} to win`;
  if (p.market === 'dc') return p.side === '1X' ? `${esc(m.home)} or draw` : p.side === 'X2' ? `${esc(m.away)} or draw` : 'No draw';
  if (p.market === 'ah') return `${esc(sideName(m, p.side))} ${p.line > 0 ? '+' : '−'}${Math.abs(p.line)}`;
  const who = p.scope === 'total' ? 'match' : esc(sideName(m, p.scope));
  return `${LABEL[p.market] || p.market} · ${who} ${p.side} ${p.line}`;
}
function actual(p, m){
  if (!FINISHED.includes(m.status)) return '';
  if (['1x2','dc','ah','goals'].includes(p.market)) return m.ft_home != null ? `${m.ft_home}–${m.ft_away}` : '';
  const s = m.stats; if (!s) return '';
  const h = (s.h || {})[p.market] ?? (s[p.market] || [])[0], a = (s.a || {})[p.market] ?? (s[p.market] || [])[1];
  if (h == null || a == null) return '';
  return String(p.scope === 'home' ? h : p.scope === 'away' ? a : h + a);
}
function matchCell(m){
  const score = FINISHED.includes(m.status) ? ` <b>${m.ft_home ?? m.home_goals}–${m.ft_away ?? m.away_goals}</b>${m.status !== 'FT' ? ` <span class="muted small">${m.status}</span>` : ''}` : '';
  return `<a href="#" data-m="${m.id}">${esc(m.home)} – ${esc(m.away)}</a>${score}<div class="muted small">${esc(m.league)} · ${dd(m.date_utc)} ${tm(m.date_utc)}</div>`;
}
function bindMatchLinks(){ document.querySelectorAll('[data-m]').forEach(a => a.onclick = ev => { ev.preventDefault(); showMatch(+a.dataset.m); }); }
function recordLine(o, label){
  if (!o || !o.n) return '';
  return `<span class="chip">${label}: <b>${o.won}/${o.n}</b> won (${pct(o.hit)}) · model said ${pct(o.said)}${o.roi != null ? ` · ROI ${o.roi >= 0 ? '+' : ''}${pct(o.roi,1)}` : ''}</span>`;
}

// ---------------------------------------------------------------- tabs
const views = {};

views.matches = async () => {
  ST.mday ??= 'today';
  app.innerHTML = `<div class="head"><h2>Matches</h2><p>Every match with the model's prediction: win chances and expected corners, shots, shots on target, offsides and substitutions. After the match the real numbers are shown next to the prediction.</p></div>
    <div class="bar">${seg('Day', ST.mday, DAYS, v => { ST.mday = v; save(); load(); })}<label>Competition${compSel(ST.mcomp)}</label></div><div id="out"><div class="empty">Loading…</div></div>`;
  $('.comp').onchange = e => { ST.mcomp = e.target.value; save(); load(); };
  async function load(){
    const r = dayRange(ST.mday);
    const rows = await api(`/matches?frm=${r.frm}&to=${r.to}${ST.mcomp ? '&league=' + ST.mcomp : ''}`);
    if (!rows.length){ $('#out').innerHTML = `<div class="empty">No matches in this period.</div>`; return; }
    const byDay = {};
    rows.forEach(m => (byDay[dd(m.date_utc)] ??= []).push(m));
    const cell = (m, s) => {
      const e = m.pred && m.pred[s], a = m.stats && m.stats[s];
      const exp = e ? f1(e[0] + e[1]) : '–';
      if (a && a[0] != null) { const t = a[0] + a[1]; return `${t} <span class="muted small">/ ${exp}</span>`; }
      return `<span class="muted">${exp}</span>`;
    };
    $('#out').innerHTML = Object.entries(byDay).map(([d, ms]) => `<div class="mgroup">${d}</div><div class="card tablewrap" style="padding:4px 8px"><table>
      <tr><th class="l">Match</th><th class="l">Home · Draw · Away</th>${PSTATS.map(s => `<th>${LABEL[s]}</th>`).join('')}</tr>
      ${ms.map(m => { const p = m.pred; return `<tr><td class="l">${matchCell(m)}</td>
        <td class="l">${p ? `<div class="probbar"><i style="width:${p.p1*100}%"></i><i style="width:${p.px*100}%"></i><i style="width:${p.p2*100}%"></i></div><span class="small">${pct(p.p1)} · ${pct(p.px)} · ${pct(p.p2)}</span>` : '<span class="muted small">no prediction</span>'}</td>
        ${PSTATS.map(s => `<td>${cell(m, s)}</td>`).join('')}</tr>`; }).join('')}
    </table></div>`).join('') + `<p class="muted small">Statistics columns: expected match total; after the match: <b>real</b> / expected. ${rows.some(m => m.pred_kind === 'backtest') ? 'Past matches before live tracking show the walk-forward test prediction (made only from earlier matches).' : ''}</p>`;
    bindMatchLinks();
  }
  load();
};

views.teams = async () => {
  const teams = await api('/teams');
  ST.tlast ??= 10; ST.tvenue ??= 'all';
  app.innerHTML = `<div class="head"><h2>Teams</h2><p>Averages for and against, recent matches, an over/under checker, and a ranking per competition.</p></div>
    <div class="bar"><label style="flex:1;min-width:200px">Team<input id="tq" list="tl" placeholder="Type a team name…"><datalist id="tl">${teams.map(t => `<option value="${esc(t.name)}">`).join('')}</datalist></label>
      <label>Last N<select id="last">${opts([[5,'5'],[10,'10'],[20,'20'],[38,'38'],[100,'100']], ST.tlast)}</select></label>
      <label>Venue<select id="venue">${opts([['all','All'],['home','Home'],['away','Away']], ST.tvenue)}</select></label></div>
    <div id="out"></div>
    <div class="card"><h3>Ranking</h3><div class="bar" style="margin-top:0">
      <label>Competition<select id="bcomp">${opts(META.competitions.map(c => [c.id, c.name]), ST.bcomp || 39)}</select></label>
      <label>Season<select id="bseason">${opts(META.seasons.map(s => [s, `${s}/${String(s+1).slice(2)}`]), ST.bseason || META.seasons[0])}</select></label>
      <label>Stat<select id="bstat">${opts(Object.entries(LABEL).filter(([k]) => k !== 'goals'), ST.bstat || 'corners')}</select></label></div><div class="tablewrap" id="board"></div></div>`;
  let current = ST.team || null;
  if (current){ const t = teams.find(x => x.id === current); if (t) $('#tq').value = t.name; }
  $('#tq').onchange = () => { const t = teams.find(x => x.name === $('#tq').value); if (t){ current = ST.team = t.id; save(); load(); } };
  $('#last').onchange = e => { ST.tlast = e.target.value; save(); load(); };
  $('#venue').onchange = e => { ST.tvenue = e.target.value; save(); load(); };
  ['bcomp','bseason','bstat'].forEach(i => $('#'+i).onchange = e => { ST[i] = e.target.value; save(); board(); });
  async function load(){
    if (!current){ $('#out').innerHTML = teams.length ? '' : `<div class="empty">No data yet. Start a backfill on the Data tab.</div>`; return; }
    const q = `last=${$('#last').value}&venue=${$('#venue').value}`;
    const d = await api(`/team/${current}?${q}`), sm = d.summary;
    $('#out').innerHTML = `<div class="card"><h3>${logo(d.team.logo)}${esc(d.team.name)} <span class="muted small" style="font-weight:400">· ${sm.matches} matches</span></h3>
      <div class="grid">${PSTATS.map(s => `<div class="tile"><div class="k">${LABEL[s]}</div><div class="v">${fmt(sm[s].for)}</div><div class="s">against ${fmt(sm[s].against)} · match ${fmt(sm[s].total)}</div></div>`).join('')}</div></div>
      <div class="card"><h3>Over / under check</h3><div class="bar" style="margin:0">
        <label>Stat<select id="ous">${opts(Object.entries(LABEL).filter(([k]) => k !== 'goals'), 'corners')}</select></label>
        <label>Count<select id="ouc">${opts([['total','Match total'],['for','Team\'s own'],['against','Opponent\'s']], 'total')}</select></label>
        <label>Line<input id="oul" type="number" step="0.5" value="9.5" style="width:90px"></label><button class="btn" id="oub">Check</button></div><div id="ouo"></div></div>
      <div class="card tablewrap"><h3>Matches</h3><table><tr><th class="l">Match</th>${PSTATS.map(s => `<th>${LABEL[s]}</th>`).join('')}</tr>
        ${d.matches.map(m => `<tr><td class="l"><a href="#" data-m="${m.id}">${m.venue==='H' ? '<b>'+esc(m.home)+'</b> – '+esc(m.away) : esc(m.home)+' – <b>'+esc(m.away)+'</b>'}</a> ${m.home_goals}–${m.away_goals}<div class="muted small">${esc(m.league)} · ${dd(m.date_utc)}</div></td>
        ${PSTATS.map(s => `<td>${m['for_'+s] ?? '–'} <span class="muted">/ ${m['against_'+s] ?? '–'}</span></td>`).join('')}</tr>`).join('')}</table>
        <p class="muted small">Team / opponent.</p></div>`;
    bindMatchLinks();
    $('#oub').onclick = async () => {
      const r = await api(`/overunder?team=${current}&stat=${$('#ous').value}&scope=${$('#ouc').value}&line=${$('#oul').value}&${q}`), line = +$('#oul').value;
      $('#ouo').innerHTML = r.matches ? `<div style="margin-top:10px"><span class="chip">Over <b>${r.over}/${r.matches}</b> (${r.over_pct}%)</span><span class="chip">Fair odds over <b>${r.fair_odds_over ?? '–'}</b></span><span class="chip">under <b>${r.fair_odds_under ?? '–'}</b></span></div>
        <div class="dots">${r.values.map(v => `<span class="dot" style="background:var(${v > line ? '--good' : '--warn'})">${v}</span>`).join('')}</div>` : `<div class="empty">No matches.</div>`;
    };
  }
  async function board(){
    if (!$('#bseason').value){ $('#board').innerHTML = `<div class="empty">No data yet.</div>`; return; }
    const rows = await api(`/leaderboard?league=${$('#bcomp').value}&season=${$('#bseason').value}&stat=${$('#bstat').value}`);
    $('#board').innerHTML = rows.length ? `<table><tr><th class="l">#</th><th class="l">Team</th><th>Matches</th><th>For</th><th>Against</th><th>Match total</th></tr>
      ${rows.map((t,i) => `<tr class="click" data-t="${t.id}"><td class="l muted">${i+1}</td><td class="l">${logo(t.logo)}${esc(t.name)}</td><td>${t.matches}</td><td>${fmt(t.avg_for)}</td><td>${fmt(t.avg_against)}</td><td>${fmt(t.avg_total)}</td></tr>`).join('')}</table>` : `<div class="empty">No statistics for this selection.</div>`;
    document.querySelectorAll('tr[data-t]').forEach(tr => tr.onclick = () => { current = ST.team = +tr.dataset.t; save(); const t = teams.find(x => x.id === current); if (t) $('#tq').value = t.name; load(); scrollTo({top:0, behavior:'smooth'}); });
  }
  load(); board();
};

views.predictions = async () => {
  const d = await api('/model');
  const act = d.runs.find(r => r.active);
  const bt = act?.metrics?.backtest || {};
  const tun = act?.metrics?.tuning || {};
  const calib = tab => d.calibration.filter(c => c.tab === tab && c.n >= 30);
  app.innerHTML = `<div class="head"><h2>Predictions</h2><p>How the model works, how good it is, and its history. Every statistic has its own model: each team gets an attack and a defence strength, plus home advantage and competition level, fitted on earlier matches with recent ones counting more. "Improve" tries other settings on the last year and keeps them only if they predict better.</p></div>
    <div class="bar"><button class="btn" data-job="run">Run predictions now</button><button class="btn ghost" data-job="improve">Improve model</button><button class="btn ghost" data-job="backtest">Re-run test</button><span id="jobst" class="muted small"></span></div>
    ${act ? `<div class="card"><h3>Active model ${esc(act.version)} <span class="muted small" style="font-weight:400">· ${esc(dt(act.created_at))} · ${esc(act.notes || '')}</span></h3>
      <div class="tablewrap"><table><tr><th class="l">Statistic</th><th>Matches tested</th><th>Log score</th><th>Without team strengths</th><th>Gain</th><th>Avg. error</th><th class="l">Settings</th></tr>
      ${['goals', ...PSTATS].map(s => { const m = bt[s]; const p = act.params[s] || {}; return m ? `<tr><td class="l">${LABEL[s]}</td><td>${m.n.toLocaleString()}</td><td>${m.log_score.toFixed(3)}</td><td class="muted">${m.baseline.toFixed(3)}</td><td class="${m.skill > 0 ? 'won' : 'lost'}">${m.skill > 0 ? '+' : ''}${m.skill.toFixed(3)}</td><td>±${m.mae.toFixed(2)}</td><td class="l muted small">memory ${p.half_life} d · shrink ${p.lam}</td></tr>` : ''; }).join('')}
      </table></div>
      ${bt['1x2'] ? `<p class="small" style="margin-bottom:0">Match result (home / draw / away): favourite right in <b>${pct(bt['1x2'].accuracy, 1)}</b> of ${bt['1x2'].n.toLocaleString()} matches · log loss ${bt['1x2'].log_loss.toFixed(3)} (always 33/33/33 would be 1.099) · Brier ${bt['1x2'].brier.toFixed(3)}.</p>` : `<p class="muted small">No walk-forward test yet — press "Re-run test".</p>`}
      <p class="muted small" style="margin-bottom:0">Walk-forward test: each match predicted only from matches before it, refitted every week. Log score: higher (closer to 0) is better; "gain" is how much the team strengths add over competition averages.</p></div>` : `<div class="empty">No model yet. After the data backfill press "Run predictions now".</div>`}
    <div class="cols2">${['confidence','sure'].map(tab => `<div class="card"><h3>${tab === 'sure' ? 'Sure Bets' : 'Confidence'}: said vs happened</h3>${calib(tab).length ? `<table><tr><th class="l">Model said</th><th>Picks</th><th>Avg. said</th><th>Won</th></tr>
      ${calib(tab).map(c => `<tr><td class="l">${pct(c.b)}–${pct(c.b + .05)}</td><td>${c.n.toLocaleString()}</td><td>${pct(c.said,1)}</td><td class="${Math.abs(c.hit - c.said) < .03 ? 'won' : 'lost'}">${pct(c.hit,1)}</td></tr>`).join('')}</table>
      <p class="muted small" style="margin-bottom:0">If the model is honest, "won" is close to "avg. said".</p>` : '<div class="muted small">No test yet.</div>'}</div>`).join('')}</div>
    <div class="card"><h3>Live record (picks made before kick-off)</h3>${d.live.length ? `<table><tr><th class="l">Tab</th><th>Picks</th><th>Settled</th><th>Won</th><th>Model said</th></tr>
      ${d.live.map(l => { const s = l.n - l.open; return `<tr><td class="l">${({confidence:'Confidence',sure:'Sure Bets',easy:'Easy Wins',bet_on:'Bet on'})[l.tab]}</td><td>${l.n}</td><td>${s}</td><td>${s ? `${l.won} (${pct(l.won / s)})` : '–'}</td><td>${pct(l.said)}</td></tr>`; }).join('')}</table>` : '<div class="muted small">Starts with the first predictions.</div>'}</div>
    <div class="card"><h3>Model history</h3><table><tr><th class="l">Version</th><th class="l">Made</th><th class="l">Result</th><th>Total log score (last year)</th></tr>
      ${d.runs.map(r => { const t = r.metrics.tuning; const tot = t ? Object.entries(t).filter(([k]) => k !== '1x2').reduce((a,[,v]) => a + v.log_score, 0) : null; return `<tr><td class="l">${esc(r.version)} ${r.active ? '<span class="chip">active</span>' : ''}</td><td class="l">${esc(dt(r.created_at))}</td><td class="l small">${esc(r.notes || '')}</td><td>${tot != null ? tot.toFixed(4) : '–'}</td></tr>`; }).join('')}</table></div>`;
  document.querySelectorAll('[data-job]').forEach(b => b.onclick = async () => {
    const r = await api('/admin/sync', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({kind: b.dataset.job})});
    $('#jobst').textContent = r.started ? 'Started — progress on the Data tab.' : r.reason;
  });
};

async function pickTab({tab, title, intro, history, controls, filter, row, head, extra}){
  ST[tab + 'day'] ??= 'today';
  app.innerHTML = `<div class="head"><h2>${title}</h2>${intro}</div><div id="hist"></div>
    <div class="bar">${seg('Day', ST[tab + 'day'], DAYS, v => { ST[tab + 'day'] = v; save(); load(); })}${controls()}<label>Competition${compSel(ST[tab + 'comp'])}</label></div>
    <div id="sum"></div><div id="out"><div class="empty">Loading…</div></div>`;
  $('.comp').onchange = e => { ST[tab + 'comp'] = e.target.value; save(); load(); };
  let H = null;
  async function load(){
    const r = dayRange(ST[tab + 'day']);
    const [d, h] = await Promise.all([api(`/picks?tab=${tab}&frm=${r.frm}&to=${r.to}&mn=${extra ? extra() : 0}`), H ? H : api(`/history?tab=${tab}`)]);
    H = h; $('#hist').innerHTML = history(h);
    let ps = d.picks.filter(p => { const m = d.matches[p.match_id]; return m && (!ST[tab + 'comp'] || String(m.league_id) === ST[tab + 'comp']); }).filter(p => filter(p, d.matches[p.match_id], d));
    const settled = ps.filter(p => p.result === 'won' || p.result === 'lost');
    $('#sum').innerHTML = (d.source === 'backtest' ? `<p class="muted small">Live tracking hadn't started for this period, so these are the walk-forward test picks (made only from earlier matches).</p>` : d.source === 'mixed' ? `<p class="muted small">Matches played before live tracking started show the walk-forward test picks (made only from earlier matches).</p>` : '') +
      (settled.length ? `<div class="note">This period: <b>${settled.filter(p => p.result === 'won').length}/${settled.length}</b> won (${pct(settled.filter(p => p.result === 'won').length / settled.length)}) · model said ${pct(settled.reduce((a,p) => a + p.prob, 0) / settled.length)} on average${settled.some(p => p.price) ? ` · profit ${(settled.reduce((a,p) => a + (p.result === 'won' ? p.price - 1 : -1), 0) * 10).toFixed(2)} € per 10 € stakes` : ''}.</div>` : '');
    if (!ps.length){ $('#out').innerHTML = `<div class="empty">Nothing for this selection.</div>`; return; }
    ps.sort((a,b) => d.matches[a.match_id].date_utc.localeCompare(d.matches[b.match_id].date_utc) || b.prob - a.prob);
    $('#out').innerHTML = `<div class="card tablewrap" style="padding:4px 8px"><table><tr>${head}</tr>${ps.map(p => row(p, d.matches[p.match_id], d)).join('')}</table></div>`;
    bindMatchLinks();
  }
  window.__reload = load;
  load();
}

    intro:`<p>Matches where the model is at least this sure of the result: a team to win, or a team not to lose (double chance). Football has draws, so 90%+ on a winner is rare; double chance is where the high numbers are.</p>`,
    controls: () => seg('At least', ST.cmin, [['0.8','80%'],['0.85','85%'],['0.9','90%']], v => { ST.cmin = v; save(); __reload(); }) +

// ---------------------------------------------------------------- match detail
async function showMatch(id){
  $('#modal').hidden = false; $('#mbody').innerHTML = '<div class="empty">Loading…</div>';
  const d = await api(`/match/${id}/full`), m = d.match, p = d.prediction;
  const [h, a] = [d.stats.find(s => s.is_home), d.stats.find(s => !s.is_home)];
  const odds = {}; d.odds.forEach(o => odds[[o.market, o.scope, o.side, o.line].join('|')] = o);
  const done = FINISHED.includes(m.status);
  const linesTable = (s, scope) => { const L = p.markets[s][scope]; const real = done && h && a ? (scope === 'home' ? h[s] : scope === 'away' ? a[s] : h[s] + a[s]) : null;
    return `<table class="small"><tr><th class="l">Line</th><th>Over</th><th>Fair</th><th>Best price</th><th>Under</th><th>Fair</th><th>Best price</th></tr>${L.filter(x => x.over > .03 && x.over < .97).map(x => {
      const oo = odds[[s, scope, 'over', x.line].join('|')], ou = odds[[s, scope, 'under', x.line].join('|')];
      const hit = real != null ? (real > x.line ? 'won' : 'lost') : '';
      return `<tr><td class="l">${x.line}</td><td class="${hit}">${pct(x.over)}</td><td class="muted">${fair(x.over)}</td><td>${oo ? `<b class="${oo.price * x.over > 1 ? 'won' : ''}">${oo.price.toFixed(2)}</b>` : ''}</td><td class="${hit ? (hit === 'won' ? 'lost' : 'won') : ''}">${pct(1 - x.over)}</td><td class="muted">${fair(1 - x.over)}</td><td>${ou ? `<b class="${ou.price * (1 - x.over) > 1 ? 'won' : ''}">${ou.price.toFixed(2)}</b>` : ''}</td></tr>`; }).join('')}</table>`; };
  $('#mbody').innerHTML = `<h3 style="font-size:18px">${esc(m.home)} ${done ? `${m.ft_home ?? m.home_goals}–${m.ft_away ?? m.away_goals}` : 'vs'} ${esc(m.away)}</h3>
    <div class="muted small">${dt(m.date_utc)} · ${esc(m.round || '')} · ${esc(m.venue || '')}${m.referee ? ' · Ref: ' + esc(m.referee) : ''}</div>
    ${p ? `<div class="note" style="margin-top:12px">Model ${esc(p.version)} (${p.kind === 'live' ? 'before kick-off' : 'walk-forward test'}): <b>${esc(m.home)} ${pct(p.p1)}</b> · draw <b>${pct(p.px)}</b> · <b>${esc(m.away)} ${pct(p.p2)}</b> · fair odds ${fair(p.p1)} / ${fair(p.px)} / ${fair(p.p2)}
      <br>Expected: ${['goals', ...PSTATS].filter(s => p.markets[s]).map(s => `${LABEL[s]} <b>${f1(p.markets[s].expected[0])}–${f1(p.markets[s].expected[1])}</b>${done && h && a && s !== 'goals' ? ` <span class="muted">(real ${h[s]}–${a[s]})</span>` : ''}`).join(' · ')}</div>` : '<p class="muted">No prediction for this match.</p>'}
    ${d.picks.length ? `<div class="mgroup">Picks</div>${d.picks.map(x => `<span class="chip">${({confidence:'Confidence',sure:'Sure',easy:'Easy',bet_on:'Bet on'})[x.tab]}: ${pickLabel(x, m)} ${pct(x.prob)}${x.price ? ' @' + x.price.toFixed(2) : ''} <span class="${resCls(x.result)}">${resTxt(x.result)}</span></span>`).join('')}` : ''}
    ${p ? `<div class="mgroup">Over / under — model chance, fair odds and best bookmaker price</div>
      <div class="bar" style="margin:6px 0"><label>Statistic<select id="mstat">${opts(['goals', ...PSTATS].filter(s => p.markets[s]).map(s => [s, LABEL[s]]), 'corners')}</select></label><label>For<select id="mscope">${opts([['total','Match'],['home',m.home],['away',m.away]], 'total')}</select></label></div>
      <div id="mlines" class="tablewrap"></div>` : ''}
    ${h && a ? `<div class="mgroup">Match statistics</div><table class="small"><tr><th class="l"></th><th>${esc(m.home)}</th><th>${esc(m.away)}</th></tr>${['corners','total_shots','shots_on_goal','offsides','subs','fouls','yellow','red','possession','xg'].map(s => `<tr><td class="l">${LABEL[s] || {red:'Red cards',possession:'Possession %',xg:'xG'}[s]}</td><td>${h[s] ?? '–'}</td><td>${a[s] ?? '–'}</td></tr>`).join('')}</table>` : ''}
    ${d.substitutions.length ? `<div class="mgroup">Substitutions</div><table class="small">${d.substitutions.map(s => `<tr><td class="l">${s.minute}'${s.extra ? '+' + s.extra : ''}</td><td class="l">${s.team_id === m.home_id ? esc(m.home) : esc(m.away)}</td><td class="l">${esc(s.player)} ⇄ ${esc(s.assist)}</td></tr>`).join('')}</table>` : ''}`;
  if (p){ const draw = () => $('#mlines').innerHTML = linesTable($('#mstat').value, $('#mscope').value); $('#mstat').onchange = draw; $('#mscope').onchange = draw; draw(); }
}
$('#mx').onclick = () => $('#modal').hidden = true;
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });

// ---------------------------------------------------------------- start
$('#nav').innerHTML = TABS.map(([k,t]) => `<button data-v="${k}">${t}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => location.hash = b.dataset.v);
function route(){
  const v = (location.hash.slice(1) || 'matches').split('/')[0];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  Promise.resolve((views[v] || views.matches)()).catch(e => { if (e.message !== 'login') app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; });
}
function showSignin(){ app.hidden = true; $('#nav').hidden = true; $('#outBtn').hidden = true; $('#signin').hidden = false; $('#keyIn').focus(); }
async function start(){
  try { META = await api('/meta'); } catch(e){ if (e.message !== 'login') app.innerHTML = `<div class="empty">Could not reach the football data: ${esc(e.message)}</div>`; return; }
  $('#signin').hidden = true; app.hidden = false; $('#nav').hidden = false; $('#outBtn').hidden = false;
  window.onhashchange = route; route();
}
$('#signin').onsubmit = async ev => {
  ev.preventDefault(); KEY = $('#keyIn').value;
  const r = await fetch(API + '/meta', {headers: {'X-Admin-Key': KEY}}).catch(() => null);
  if (!r || !r.ok){ $('#signErr').hidden = false; KEY = ''; return; }
  try { localStorage.setItem('ior:key', KEY); } catch(e){}
  $('#signErr').hidden = true; $('#keyIn').value = ''; start();
};
$('#outBtn').onclick = async () => {
  if (REMOTE){ KEY = ''; try { localStorage.removeItem('ior:key'); } catch(e){} showSignin(); }
  else { await fetch('/football/logout', {method:'POST'}); location.href = '/football/login'; }
};
if (!REMOTE || KEY) start(); else showSignin();
</script>
</body>
</html>
