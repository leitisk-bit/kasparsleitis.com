<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaspars Leitis</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #111; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0; color: #444; }
  a { color: inherit; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #bbb; } }
  main { width: 100%; max-width: 420px; }
  form { margin-top: 2rem; display: flex; flex-direction: column; gap: .5rem; text-align: left; }
  textarea, input { font: inherit; padding: .6rem .7rem; border: 1px solid #ccc; border-radius: 8px; background: transparent; color: inherit; box-sizing: border-box; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  button { font: inherit; padding: .6rem; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hp { position: absolute; left: -9999px; }
  #status { min-height: 1.2em; font-size: .9rem; text-align: center; }
  @media (prefers-color-scheme: dark) { textarea, input { border-color: #444; } button { background: #eee; color: #111; } }
</style>
</head>
<body>
<main>
  <h1>Kaspars Leitis</h1>
  <p>If something needed: <a href="mailto:leitis.k@gmail.com">leitis.k@gmail.com</a></p>
  <form id="msg">
    <textarea name="message" maxlength="3000" placeholder="Write me a message…" required></textarea>
    <input name="contact" maxlength="200" placeholder="Your email or phone (optional)">
    <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Send</button>
    <div id="status" role="status"></div>
  </form>
</main>
<script>
document.getElementById('msg').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button'), st = document.getElementById('status');
  btn.disabled = true; st.textContent = 'Sending…';
  try {
    const r = await fetch('/contact/send.php', { method: 'POST', body: new FormData(f) });
    const j = await r.json();
    st.textContent = j.message;
    if (j.ok) f.reset();
  } catch { st.textContent = 'Could not send. Please try again.'; }
  btn.disabled = false;
});
</script>
</body>
</html>
