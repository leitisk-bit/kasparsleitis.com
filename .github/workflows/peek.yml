# Temporary: copies the Website Builder folder so its page texts can be reused on the new site.
name: Copy builder pages (temporary)
on: { workflow_dispatch: {} }
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:prefer-epsv false; set net:timeout 20; set net:max-retries 3;
            mirror --parallel=8 --exclude-glob '*.php' --exclude-glob '*.js' --exclude-glob '*.css' --exclude-glob '*.woff*' --exclude-glob '*.ttf' --exclude-glob '*.eot' ncsitebuilder builder; bye"
          find builder -type f | sed 's/^/F /' | head -300
          du -sh builder
      - name: Print the page texts
        run: |
          echo "== sitemap"; cat builder/sitemap.txt; echo
          python3 - <<'PY'
          import sqlite3, json, re, html
          c = sqlite3.connect('builder/dat/project.db')
          tabs = [r[0] for r in c.execute("select name from sqlite_master where type='table'")]
          print("== tables", tabs)
          seen = set()
          for t in tabs:
              cols = [r[1] for r in c.execute(f"pragma table_info('{t}')")]
              for row in c.execute(f"select * from '{t}'"):
                  for v in row:
                      if isinstance(v, bytes):
                          try: v = v.decode('utf-8')
                          except: continue
                      if not isinstance(v, str): continue
                      for m in [v] + re.findall(r'"(?:content|text|title|html|name|value|href|src|alt|url)"\s*:\s*"((?:[^"\\]|\\.){3,})"', v):
                          try: m = json.loads('"' + m + '"')
                          except Exception: pass
                          m = re.sub(r'<[^>]+>', ' ', html.unescape(m)); m = re.sub(r'\s+', ' ', m).strip()
                          if len(m) > 2 and m not in seen:
                              seen.add(m); print("T", t, "|", m[:1500])
          PY
