# One-off: copies what is on the Namecheap site now into site/ and commits it,
# so the repository starts from the real current site. Run it from the Actions tab.
# The WordPress install (Wordpress/) and Namecheap's old site-builder folders are left out:
# WordPress keeps its content in a database and updates its own files.
name: Import current site from Namecheap

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download the site
        timeout-minutes: 12
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p site
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ftp:prefer-epsv false; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 5; set xfer:log true; debug 2 -o lftp-debug.txt; cls -la;
            mirror --verbose --parallel=4 \
              --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob Wordpress/ --exclude-glob ncsitebuilder/ --exclude-glob nc_assets/ --exclude-glob .ftpquota --exclude-glob error_log --exclude-glob '*.log' \
              . site; bye"
          echo "Files: $(find site -type f | wc -l), size: $(du -sh site | cut -f1)"

      - name: Show connection log if the download failed
        if: failure()
        run: grep -v -i "pass" lftp-debug.txt | tail -60 || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet && echo "Nothing new" || git commit -m "Import current site from Namecheap"
          git push
