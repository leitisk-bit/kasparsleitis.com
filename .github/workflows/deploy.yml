# Uploads the site/ folder to Namecheap whenever it changes on main.
# Only changed files are sent. Files on the server that never came from this repo are left alone.
name: Deploy to Namecheap

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ./   # the FTP account opens straight into public_html
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: Check the live site
        run: |
          for path in / /telpuO/ /telpuO/rk2026-2/; do
            code=$(curl -sk -o page.html -w '%{http_code}' --max-time 30 "https://kasparsleitis.com$path")
            echo "$code  https://kasparsleitis.com$path  $(grep -o '<title>[^<]*' page.html | head -1 | sed 's/<title>//')"
          done
          for url in https://telpuo.kasparsleitis.com/ https://telpuo.kasparsleitis.com/api/admin https://telpuo.kasparsleitis.com/api/maps; do
            code=$(curl -s -o page.txt -w '%{http_code}' --max-time 30 "$url"); echo "$code  $url  $(head -c 160 page.txt | tr '\n' ' ')"
          done
          echo "SSL: $(echo | openssl s_client -connect kasparsleitis.com:443 -servername kasparsleitis.com 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null)"
