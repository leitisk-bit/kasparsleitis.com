# Uploads the site/ folder to Namecheap whenever it changes on main.
# Only changed files are sent. Files on the server that never came from this repo are left alone.
name: Deploy to Namecheap

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sound Machine (/musicif/): build config.php from GitHub Secrets. It is never committed (public repo).
      - name: Write /musicif/config.php from secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MUSICIF_ADMIN_PASSWORD: ${{ secrets.MUSICIF_ADMIN_PASSWORD }}
          MUSICIF_PLAYER_KEY: ${{ secrets.MUSICIF_PLAYER_KEY }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$MUSICIF_ADMIN_PASSWORD" ] || [ -z "$MUSICIF_PLAYER_KEY" ]; then
            echo "Sound Machine secrets not set yet — skipping config.php"; exit 0
          fi
          python3 - <<'PY'
          import os
          q = lambda v: "'" + v.replace("\\", "\\\\").replace("'", "\\'") + "'"
          e = os.environ
          cfg = {
              'spotify_client_id': e['SPOTIFY_CLIENT_ID'],
              'spotify_client_secret': e.get('SPOTIFY_CLIENT_SECRET', ''),
              'redirect_uri': 'https://kasparsleitis.com/musicif/callback.php',
              'admin_password': e['MUSICIF_ADMIN_PASSWORD'],
              'player_key': e['MUSICIF_PLAYER_KEY'],
              'timezone': 'Europe/Riga',
              'device_name': 'Sound Machine',
          }
          body = "<?php\n// Generated by the deploy workflow from GitHub Secrets. Do not edit on the server.\nreturn [\n"
          body += "".join(f"    {q(k)} => {q(v)},\n" for k, v in cfg.items()) + "];\n"
          open('site/musicif/config.php', 'w').write(body)
          print("config.php written")
          PY

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ./   # the FTP account opens straight into public_html
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: Check the live site
        run: |
          for path in / /telpuO/ /telpuO/rk2026-2/ /musicif/ "/musicif/api.php?action=config"; do
            code=$(curl -sk -o page.html -w '%{http_code}' --max-time 30 "https://kasparsleitis.com$path" || true)
            echo "$code  https://kasparsleitis.com$path  $(grep -o '<title>[^<]*' page.html | head -1 | sed 's/<title>//')"
          done
          for url in https://telpuo.kasparsleitis.com/ https://telpuo.kasparsleitis.com/api/admin https://telpuo.kasparsleitis.com/api/maps; do
            code=$(curl -s -o page.txt -w '%{http_code}' --max-time 30 "$url" || true); echo "$code  $url  $(head -c 160 page.txt | tr '\n' ' ')"
          done
          echo "Nameservers: $(dig +short NS kasparsleitis.com | tr '\n' ' ')  telpuo: $(dig +short telpuo.kasparsleitis.com | tr '\n' ' ')"
          echo "SSL: $(echo | openssl s_client -connect kasparsleitis.com:443 -servername kasparsleitis.com 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null)"
