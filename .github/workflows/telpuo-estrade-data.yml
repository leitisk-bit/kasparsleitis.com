name: Telpu O estrade 3D data
# Downloads the Riga open 3D data (LiDAR 2022, CC BY 4.0, Rigas valstspilsetas pasvaldiba) for Mezaparks Liela
# estrade and turns it into a compact height grid for the replay's 3D view (the session that builds the app
# cannot reach s3.lvdc.gov.lv itself).
on:
  workflow_dispatch:
    inputs:
      cell: { description: 'Grid cell (m)', required: false, default: '0.5' }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install laspy lazrs numpy pyproj pillow scipy
      - name: Download
        run: |
          mkdir -p las out
          for t in 4311-42-55.1.1 4311-42-55.1.2 4311-42-45.3.4 4311-42-45.3.3 4311-42-55.1.3 4311-42-55.1.4; do
            curl -sS --fail --max-time 600 -o las/$t.las https://s3.lvdc.gov.lv/rdgis-opendata/LIDAR_2022/LAS/$t.las && echo "LAS $t $(stat -c %s las/$t.las) bytes" || echo "LAS $t FAILED"
            echo "DAE $t $(curl -sSI --max-time 60 https://s3.lvdc.gov.lv/rdgis-opendata/3D_RM_2022/DAE/$t.zip | tr -d '\r' | grep -i content-length)"
          done
      - name: Height grid
        run: python telpuo-app/tools/estrade_grid.py las out ${{ inputs.cell }}
      - uses: actions/upload-artifact@v4
        with: { name: estrade-grid, path: out/ }
