name: Telpu O estrade 3D data
# Downloads the Riga open 3D data (LiDAR 2022, CC BY 4.0, Rigas valstspilsetas pasvaldiba) for Mezaparks Liela
# estrade and turns it into a compact height grid for the replay's 3D view (the session that builds the app
# cannot reach s3.lvdc.gov.lv itself).
on:
  workflow_dispatch:
    inputs:
      cell: { description: 'Grid cell (m)', required: false, default: '0.5' }
      slice: { description: 'Only print raw points in boxes E0,N0,E1,N1 (space separated)', required: false, default: '' }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install laspy lazrs numpy pyproj pillow scipy
      - uses: actions/cache@v4
        with: { path: las, key: estrade-las-2022 }
      - name: Download
        timeout-minutes: 300
        run: |
          mkdir -p las out
          # (the server is slow, about 0.5 MB/s a file: all tiles at once, resuming until complete)
          dl() { [ -s las/$1.las ] && [ "$(stat -c %s las/$1.las)" = "$(curl -sSI --max-time 60 https://s3.lvdc.gov.lv/rdgis-opendata/LIDAR_2022/LAS/$1.las | tr -d '\r' | grep -i content-length | awk '{print $2}')" ] && { echo "LAS $1 cached"; return; }
                 for k in 1 2 3 4 5 6; do curl -sS --fail -C - --max-time 5400 -o las/$1.las https://s3.lvdc.gov.lv/rdgis-opendata/LIDAR_2022/LAS/$1.las && break; sleep 10; done
                 echo "LAS $1 $(stat -c %s las/$1.las 2>/dev/null) bytes of $(curl -sSI --max-time 60 https://s3.lvdc.gov.lv/rdgis-opendata/LIDAR_2022/LAS/$1.las | tr -d '\r' | grep -i content-length)"; }
          for t in 4311-42-55.1.1 4311-42-55.1.2 4311-42-45.3.4 4311-42-45.3.3 4311-42-55.1.3 4311-42-55.1.4; do dl $t & done; wait
      - name: Slice
        if: ${{ inputs.slice != '' }}
        run: python telpuo-app/tools/estrade_slice.py las ${{ inputs.slice }}
      - name: Height grid
        if: ${{ inputs.slice == '' }}
        run: python telpuo-app/tools/estrade_grid.py las out ${{ inputs.cell }}
      - name: Commit the grid
        if: ${{ inputs.slice == '' }}
        run: |
          mkdir -p telpuo-app/sitedata && cp out/grid.npz telpuo-app/sitedata/estrade_grid.npz && cp out/info.json telpuo-app/sitedata/estrade_grid.json
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add telpuo-app/sitedata/estrade_grid.npz telpuo-app/sitedata/estrade_grid.json
          git commit -m "Estrade height grid from Riga open LiDAR 2022 (CC BY 4.0, Rigas valstspilsetas pasvaldiba)" || exit 0
          for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
