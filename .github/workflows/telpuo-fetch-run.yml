# Prints a saved run from the Telpu O app (gzip + base64 in the log), so a replay problem can be looked at.
name: Telpu O fetch run
on:
  workflow_dispatch:
    inputs:
      run: { description: 'Run id', required: true }
permissions: { contents: read }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - env: { CHECK: '${{ secrets.TELPUO_CHECK_KEY }}' }
        run: |
          B=https://telpuo.kasparsleitis.com
          echo "LIVE checkCard in page: $(curl -s --max-time 30 $B/ | grep -c checkCard) resLof: $(curl -s --max-time 30 $B/ | grep -c resLof) resClear: $(curl -s --max-time 30 $B/ | grep -c resClear) | $(curl -sI --max-time 30 $B/ | tr -d '\r' | grep -i last-modified)"
          echo "LIVE admin api: $(curl -s --max-time 30 $B/api/admin)"
          mkdir -p runs
          code=$(curl -s -H "X-Check-Key: $CHECK" --max-time 60 -o "runs/${{ inputs.run }}.json" -w '%{http_code}' "https://telpuo.kasparsleitis.com/api/runs/${{ inputs.run }}")
          echo "HTTP $code, $(wc -c < runs/${{ inputs.run }}.json) bytes"; echo "RUNDATA $(gzip -c runs/${{ inputs.run }}.json | base64 -w0)"
