# Runs a job of the football app on the home server and prints what happened, so it can be done without
# logging in to the server. Goes through the replay app's tunnel route (telpuo.kasparsleitis.com/football-api)
# with the admin password from the repository secret FOOTBALL_KEY (the replay app's ADMIN_KEY).
#   status    report only (data, odds, model versions, pick record)
#   update    fetch new results + odds, then predict / score       (same as the 2-hour timer)
#   run       predict upcoming + score finished                     (model only, no API calls)
#   improve   try other model settings; keep only if better; re-test; predict
#   backtest  re-run the walk-forward test of the active version
#   backfill  fetch whole seasons (input: seasons)
#   other     fetch all other games of our teams (domestic league, cups), every season, with details
#   collected what has been collected so far (details, weather, other games)
#   collect   extract all stored match details, fetch stadiums and weather (history + forecast)
#   factors   does weather / pitch / rest / coach change / referee tell more than the model? (analysis)
#   subs      first substitution timing: 1st half / half-time / 2nd half (analysis only)
#   betsson   fetch Betsson (= Betsafe) prices now from The Odds API and re-measure the Bet365 difference
name: Football
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        default: status
        options: [status, update, run, improve, backtest, backfill, betsson, subs, collect, factors, other, collected, oddscheck]
      seasons:
        description: Seasons for backfill
        default: "2021-2026"
concurrency: { group: football, cancel-in-progress: false }
jobs:
  football:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: ${{ inputs.action }}
        env:
          KEY: ${{ secrets.FOOTBALL_KEY }}
          ACTION: ${{ inputs.action }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          B = "https://telpuo.kasparsleitis.com/football-api"
          KEY, ACTION = os.environ.get("KEY", ""), os.environ["ACTION"]
          if not KEY:
              sys.exit("Repository secret FOOTBALL_KEY is missing (Settings → Secrets and variables → Actions).")
          def call(path, body=None, timeout=60):
              req = urllib.request.Request(B + path, method="POST" if body is not None else "GET",
                                           data=json.dumps(body).encode() if body is not None else None,
                                           headers={"X-Admin-Key": KEY, "Content-Type": "application/json",
                                                    "User-Agent": "football-workflow"})
              for i in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (401, 403): sys.exit(f"Not allowed ({e.code}): is FOOTBALL_KEY the replay app's ADMIN_KEY?")
                      if i == 3: raise
                  except Exception:
                      if i == 3: raise
                  time.sleep(10)
          if ACTION == "subs":
              print(json.dumps(call("/admin/subs", timeout=120), indent=1, ensure_ascii=False))
              sys.exit(0)
          if ACTION == "oddscheck":
              for m in call("/admin/oddscheck"):
                  print("\n", m["match"], m["date"], "| 1x2", m["1x2"], "| corners 1x2", m["corners_1x2"])
                  print("   goals AH  ", m["goals_ah"])
                  print("   corners AH", m["corners_ah"])
              sys.exit(0)
          if ACTION == "collected":
              print(json.dumps(call("/admin/collected", timeout=120), indent=1, ensure_ascii=False))
              sys.exit(0)
          if ACTION == "factors":
              f = call("/admin/factors", timeout=300)
              if "error" in f: sys.exit(f["error"])
              print(f"{f['matches']} matches with walk-forward predictions, {f['with_weather']} with weather")
              print("model's normal error (actual - expected):", f["overall_bias"])
              stats = ["goals", "corners", "total_shots", "shots_on_goal", "offsides", "yellow", "fouls"]
              for name, buckets in f["factors"].items():
                  print(f"\n== {name}   (difference vs model, %   z)")
                  print("   " + " " * 22 + "".join(f"{s[:13]:>16}" for s in stats))
                  for b, cells in buckets.items():
                      n = max((c or {}).get("n", 0) for c in cells.values())
                      fmt = lambda c: "-" if not c else "%+.1f%% %+.1f" % (c["diff_pct"], c["z"])
                      line = "".join("%16s" % fmt(cells.get(s)) for s in stats)
                      print(f"   {b[:16]:<16}{n:>6}{line}")
              rf = f["referees"]
              print(f"\n== referees with 40+ matches: {rf['count_40plus']}; beyond chance (|z|>3): {rf['beyond_chance']}")
              for x in rf["strongest_cards"]: print("   ", x)
              sys.exit(0)
          if ACTION != "status":
              st = call("/admin/status")
              if st.get("running"):
                  print("A job is already running; waiting for it first.")
              while call("/admin/status").get("running"):
                  time.sleep(20)
              r = call("/admin/sync", {"kind": ACTION, "seasons": os.environ.get("SEASONS") or "2021-2026"})
              print("started:", r); sys.stdout.flush()
              seen, t0 = "", time.time()
              time.sleep(5)
              while True:
                  st = call("/admin/status")
                  out = st.get("output") or ""
                  new = out[len(seen):] if out.startswith(seen[:200]) and len(out) >= len(seen) else out[-1500:]
                  if new.strip(): print(new, end="", flush=True)
                  seen = out
                  if not st.get("running"): break
                  if time.time() - t0 > 70 * 60: print("\n(still running after 70 min — check again with 'status')"); break
                  time.sleep(20)
              print("\n" + "=" * 70)
          rep = call("/admin/report")
          d = rep["data"]
          print(f"Server time {rep['now']} · deployed code {rep.get('deployed')}")
          print(f"\nDATA  {d['matches_with_stats']} matches with stats (latest {d['latest_with_stats']}), "
                f"{d['finished_without_stats']} finished without stats, {d['upcoming_7d']} upcoming in 7 days")
          for s in d["by_season"]: print(f"   {s['season']}: {s['matches']} matches, {s['with_stats']} with stats")
          print("\nODDS  market/scope: matches · books · prices · last seen")
          for o in rep["odds"]["by_market"]: print(f"   {o['market']:<14}{o['scope']:<7}{o['matches']:>5} {o['books']:>3} {o['prices']:>7}  {o['last']}")
          print("\nBOOKMAKERS kept:", ", ".join(f"{b['bookmaker']} ({b['matches']} matches)" for b in rep["odds"].get("by_bookmaker", [])) or "none")
          print("BOOKMAKERS offered by the feed:", ", ".join(f"{b['name']} ({b['fixtures']})" for b in rep["odds"].get("books_offered", [])) or "not recorded yet")
          bands = {-1: "all prices", 0: "1.00–1.50", 1: "1.50–2.20", 2: "2.20–4.00", 3: "4.00+"}
          print(f"\nBETSAFE vs BET365  ({rep['odds'].get('betsson_prices', 0)} Betsson prices stored) — Betsson price / Bet365 price:")
          for r in rep["odds"].get("betsson_vs_bet365", []):
              print(f"   {r['family']:<8} {bands.get(r['band'], r['band']):<11} n={r['n']:<5} median {r['median']:.3f}  mean {r['mean']:.3f}  range {r['low']}–{r['high']}")
          print("\nMODEL")
          for r in rep["model"]["runs"]:
              print(f"   {r['version']} {'ACTIVE' if r['active'] else '      '} {r['created_at']} {r['kind']} — {r['notes']}")
              for k in ("tuning", "backtest"):
                  for s, v in (r.get(k) or {}).items(): print(f"      {k:<9}{s:<14}{v}")
          print("\nPICKS live (made before kick-off)")
          for p in rep["picks_live"]: print(f"   {p}")
          print("PICKS walk-forward test (active version)")
          for p in rep["picks_backtest"]: print(f"   {p}")
          print("\nSYNC LOG")
          for s in rep["sync_log"]: print(f"   {s}")
          if rep["odds"]["unknown_top"]:
              print("\nODDS NOT RECOGNISED (top)")
              for u in rep["odds"]["unknown_top"]: print(f"   {u['seen']:>6}  {u['name']}  [{u['example']}]")
          PY
