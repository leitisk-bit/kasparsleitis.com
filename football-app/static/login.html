<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Stats — Login</title>
<style>
  :root{--bg:#f4f5f2;--card:#fff;--ink:#16201a;--muted:#6a756d;--accent:#1f7a4d;--line:#dfe3dc;--bad:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#18201b;--ink:#e7ece8;--muted:#93a097;--accent:#3fbf7f;--line:#2a332d;--bad:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(340px,calc(100vw - 32px))}
  h1{font-size:20px;margin:0 0 4px} p{margin:0 0 18px;color:var(--muted);font-size:14px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:16px}
  button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  .err{color:var(--bad);font-size:14px;margin-top:10px;display:none}
</style>
</head>
<body>
<form method="post" action="{{BASE}}/login">
  <h1>⚽ Football Stats</h1>
  <p>Admin access</p>
  <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password">
  <button type="submit">Log in</button>
  <div class="err" id="err"></div>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) { const el = document.getElementById('err'); el.style.display='block';
    el.textContent = e === 'locked' ? 'Too many attempts. Try again in 15 minutes.' : 'Wrong password.'; }
</script>
</body>
</html>
